# Reference template for the ephemeral nginx vhost on the EC2 cohost. Nothing
# reads this file live — the authoritative copy is
# /etc/nginx/sites-enabled/ephemeral.conf, copied from here. This is the pre-TLS
# (port 80) block; certbot adds the 443 listener + redirect in place (see
# deploy/README.md). The write rate-limit zone is in ephemeral-ratelimit.conf.
server {
    listen 80;
    listen [::]:80;
    server_name ephemeral.w3x.io;

    # The app refuses content over 32 KiB; a form post url-encodes it, which
    # can triple its size. Anything bigger gets a 413 before reaching Deno.
    client_max_body_size 128k;

    location / {
        # A burst covers pasting several things at once; sustained writes are
        # held to the zone's rate.
        limit_req zone=ephemeral_write burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3060;
        # Passes Host and X-Forwarded-Proto, which the app uses to build the
        # https Location it returns after a post.
        include /etc/nginx/proxy_params;
    }
}
