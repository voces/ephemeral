# Reference template for /etc/nginx/conf.d/ephemeral-ratelimit.conf. Nothing
# reads this file live. `map` and `limit_req_zone` must sit in the `http`
# context, which a vhost file can't hold; the stock nginx.conf includes
# conf.d/*.conf there. The vhost (ephemeral.nginx.conf) applies the limit.
#
# Only POSTs (writes) are limited: an empty key is never counted, so reads pass
# freely. Keyed per client IP; nginx terminates TLS itself, so
# $binary_remote_addr is the real client.
map $request_method $ephemeral_write_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $ephemeral_write_key zone=ephemeral_write:10m rate=30r/m;
